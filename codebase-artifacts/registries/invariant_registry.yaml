    name: Nobody Dies
    type: HARD_BLOCK
    scope: Universal
    source: v2.1 (Grok S3 + Convenor)
    description: No AI action may result in or contribute to loss of human life. Ring -1 pre-routing check. Overrides all
      other invariants.
