metadata:
  version: '3.11'
  source: Build Plan v3.11 (ORC-015)
  generated_by: Manus S7
  total_invariants: 45
  counting_rule: INV-0 through INV-39 (40 base) + INV-40 Continuous Improvement +
    INV-41 Knowledge Preservation + INV-42 Stakeholder Notification + INV-43 Boot
    Manifest Freshness + INV-44 TOS Compliance = 45. INV-7c, INV-11.8, INV-19.2 are
    sub-specifications and do NOT increment the total.
  sub_specifications:
  - INV-7c (of INV-7)
  - INV-11.8 (of INV-11)
  - INV-19.2 (of INV-19)
invariants:
- id: INV-0
  name: Nobody Dies
  type: HARD
  scope: All (Ring -1)
  description: No AI system may take or recommend actions that lead to loss of human
    life. Enforced at Ring -1 before all other checks.
- id: INV-1
  name: Sovereignty
  type: HARD
  scope: All (0-6)
  description: User sovereignty over their data and compute resources.
- id: INV-2
  name: Consent
  type: HARD
  scope: All (0-6)
  description: Explicit informed consent required for data processing.
- id: INV-3
  name: Consent Required
  type: HARD
  scope: All (0-6)
  description: No action without user consent.
- id: INV-4
  name: Transparency
  type: HARD
  scope: All (0-6)
  description: All routing decisions must be transparent and auditable.
- id: INV-5
  name: Accountability
  type: HARD
  scope: All (0-6)
  description: Clear accountability chain for all system actions.
- id: INV-6
  name: Non-Discrimination
  type: HARD
  scope: All (0-6)
  description: No discriminatory routing or service delivery.
- id: INV-7
  name: Switzerland (47% cap)
  type: HARD
  scope: All (0-6)
  description: No single provider family may exceed 47% of capability-weighted routing
    volume (L5-L6) or 60% (L0-L4). M17 Permission Engine monitors continuously.
- id: INV-8
  name: Interoperability
  type: HARD
  scope: All (0-6)
  description: System components must be interoperable across providers.
- id: INV-9
  name: Human Override Inviolability
  type: HARD
  scope: All (0-6)
  description: Human override must complete within 100ms max. Convenor retains ultimate
    authority.
- id: INV-10
  name: Safety
  type: HARD
  scope: All (0-6)
  description: System must maintain safety guarantees at all times.
- id: INV-11
  name: Provenance Integrity
  type: HARD
  scope: All (0-6)
  description: Every decision has a traceable origin. No decision exists without provenance
    chain.
- id: INV-12
  name: Transparency
  type: HARD
  scope: L0-L6
  description: TransparencyPacket accompanies every routing decision.
- id: INV-13
  name: Cross-Sphere Accountability
  type: HARD
  scope: L2-L6
  description: Accountability maintained across sphere boundaries.
- id: INV-14
  name: Ecological Responsibility
  type: HARD
  scope: All (0-6)
  description: Environmental impact must be tracked and minimized.
- id: INV-15
  name: Cultural Sensitivity
  type: HARD
  scope: All (0-6)
  description: Respect for cultural contexts in all operations.
- id: INV-16
  name: Economic Fairness
  type: HARD
  scope: All (0-6)
  description: Fair economic distribution of compute benefits.
- id: INV-17
  name: Digital Dividend
  type: HARD
  scope: L3-L6
  description: 15% floor for digital dividend. Every decision has traceable provenance
    origin.
- id: INV-18
  name: DPI Respect
  type: HARD
  scope: All (0-6)
  description: No component bypasses sovereign Digital Public Infrastructure.
- id: INV-19
  name: Water Cohesion
  type: HARD
  scope: All (0-6)
  description: No facility may claim net-positivity while downstream water quality
    deteriorates. Government-certified monitoring stations required.
- id: INV-20
  name: Neural Data Sovereignty
  type: SOFT
  scope: Phase 5+
  description: No neural data leaves originating device without on-device screening
    + explicit neural consent (M43).
- id: INV-21
  name: Outer Space Peaceful Use
  type: SOFT
  scope: Phase 5+
  description: No routing through weapons-linked orbital assets (M44).
- id: INV-22
  name: Accessibility
  type: HARD
  scope: All (0-6)
  description: System must be accessible to users with disabilities.
- id: INV-23
  name: Privacy
  type: HARD
  scope: All (0-6)
  description: User privacy must be protected by default.
- id: INV-24
  name: Resilience
  type: HARD
  scope: All (0-6)
  description: System must maintain operation under adverse conditions.
- id: INV-25
  name: Auditability
  type: HARD
  scope: All (0-6)
  description: All system operations must be auditable.
- id: INV-26
  name: Reversibility
  type: HARD
  scope: All (0-6)
  description: System actions must be reversible where possible.
- id: INV-27
  name: Proportionality
  type: HARD
  scope: All (0-6)
  description: System responses must be proportional to the situation.
- id: INV-28
  name: Minimal Authority
  type: HARD
  scope: All (0-6)
  description: Components operate with minimum necessary permissions.
- id: INV-29
  name: Separation of Duties
  type: HARD
  scope: All (0-6)
  description: Critical functions separated across different components.
- id: INV-30
  name: Defense in Depth
  type: HARD
  scope: All (0-6)
  description: Multiple layers of security and governance.
- id: INV-31
  name: Fail-Safe Defaults
  type: HARD
  scope: All (0-6)
  description: System defaults to safe state on failure.
- id: INV-32
  name: Least Privilege
  type: HARD
  scope: All (0-6)
  description: Minimum privilege principle for all operations.
- id: INV-33
  name: Complete Mediation
  type: HARD
  scope: All (0-6)
  description: Every access must be checked against authorization.
- id: INV-34
  name: Open Design
  type: HARD
  scope: All (0-6)
  description: Security through transparency, not obscurity.
- id: INV-35
  name: Economy of Mechanism
  type: HARD
  scope: All (0-6)
  description: Keep system design simple and minimal.
- id: INV-36
  name: Psychological Acceptability
  type: HARD
  scope: All (0-6)
  description: Security mechanisms must not impede usability.
- id: INV-37
  name: Work Factor
  type: HARD
  scope: All (0-6)
  description: Cost of circumvention must exceed value of breach.
- id: INV-38
  name: Compromise Recording
  type: HARD
  scope: All (0-6)
  description: All security compromises must be recorded.
- id: INV-39
  name: Trusted Path
  type: HARD
  scope: All (0-6)
  description: Secure communication channels for critical operations.
- id: INV-40
  name: Continuous Improvement
  type: HARD
  scope: All (0-6)
  description: 'System must continuously improve based on operational feedback. Measurement:
    quarterly improvement delta across TSS scores per sphere (Azure Advisor + Azure
    Monitor parallel).'
- id: INV-41
  name: Knowledge Preservation
  type: HARD
  scope: All (0-6)
  description: 'Institutional knowledge must be preserved across system updates. Measurement:
    knowledge artifact retention rate, zero-loss verification (Azure Information Protection
    parallel).'
- id: INV-42
  name: Stakeholder Notification
  type: HARD
  scope: All (0-6)
  description: 'Affected stakeholders must be notified of material system changes.
    Measurement: notification latency SLA ≤ 24h for material changes (Azure Service
    Health Alerts parallel).'
- id: INV-43
  name: Boot Manifest Freshness
  type: HARD
  scope: All (0-6)
  description: 'Boot manifest (BOOT-MANIFEST-v1) must be current within 24 hours.
    M176 validates on every session start. Dual-source: Notion primary, Git fallback.'
- id: INV-44
  name: TOS Compliance
  type: HARD
  scope: All (0-6)
  description: 'All routed workloads must pass TOS Constitutional Compliance check
    (M142) before execution. Enterprise wrapper terms AND underlying model provider
    terms evaluated per D-118. Quarterly re-verification per D-102. Safe Harbor Rule
    1 (Azure EA) accepted but subject to periodic re-verification. Measurement: TOS
    compliance rate per provider per quarter; zero tolerance for unverified routing.
    (Microsoft S4 proposal, v3.11)'
sub_specifications:
- id: INV-11.8
  parent: INV-11
  name: Water Cycle Accounting
  description: 5.0 lambda components for water cycle tracking.
- id: INV-19.2
  parent: INV-19
  name: NutrientGate Nitrate Threshold
  description: Nitrate/phosphorus runoff added to INV-19 scope.
- id: INV-7c
  parent: INV-7
  name: Provider Family Cap (Capability-Distribution Axis)
  description: Measurement by capability-weighted routing volume, NOT vendor count.
    0.47 (L5-L6), 0.60 (L0-L4).
