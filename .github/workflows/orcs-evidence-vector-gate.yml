name: ORCS Evidence Vector Gate
on:
  pull_request:
    paths:
      - 'tools/orcs_evidence_gate/**'
      - '.github/workflows/orcs-evidence-vector-gate.yml'
  workflow_dispatch:
jobs:
  stdlib-unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run evidence vector positive and negative controls
        working-directory: tools/orcs_evidence_gate
        run: python -m unittest -v test_check.py
